test_backend:
  stage: test
  image: python:3.10
  interruptible: true
  tags:
    - test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
  coverage: '/^TOTAL\s+.*\s+(\d+)%/'
  before_script:
    - python -m pip install --upgrade pip
    - pip install .[dev]
  script:
    - coverage run -m pytest
    - coverage xml --fail-under=0
    - coverage report
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
